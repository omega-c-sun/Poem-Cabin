{% extends 'base.html' %}
{% block title %}{{ t('login_title') }}{% endblock %}
{% block content %}
<section class="form-panel">
  <h1>{{ t('login_h1') }}</h1>
  <form method="post">
    <label>{{ t('login_user') }}
      <input name="username" required>
    </label>
    <label>{{ t('login_pass') }}
      <input type="password" name="password" required>
    </label>
    <button type="submit">{{ t('login_submit') }}</button>
  </form>
  <p><a href="{{ url_for('register') }}">{{ t('login_to_register') }}</a></p>
</section>
{% endblock %}
